# dsh-codegraph bundle patch
#
# Makes `dsh plugin --profile <name> add github:jiangzhenguo/dsh-codegraph`
# install as a one-click profile layer: pnpm resolves this package, the dsh
# plugin manager detects `dsh.profile.bundles` support via package.json's
# `dsh.bundle.patch`, and this patch inserts the `dsh-codegraph` application
# (node half, lib/index.js) into the host cordis composition. No manual
# dependency or patch edits are needed after install.
#
# The node half registers the 13 model-visible `codegraph_*` tools. There is
# no browser/client half.
- insert:
    - id: dsh-codegraph
      name: '@jiangzhenguo/dsh-codegraph'
